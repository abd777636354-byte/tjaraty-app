name: Build APK - تِجارتي

on:
  push:
    branches: [ "arena/01a109fb-tjaraty-app", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list_installed 2>&1 | head -n 30 || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Install dependencies
        run: npm ci

      - name: Build web (static export)
        run: npm run build

      - name: Sync Capacitor
        run: |
          npx cap sync android
          ls -lh android/app/src/main/assets/public | head -n 20
          echo "--- capacitor config ---"
          cat android/app/src/main/assets/capacitor.config.json || true

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cat android/local.properties
          ls -lh android/local.properties

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/gradle-debug.log; test ${PIPESTATUS[0]} -eq 0

      - name: Show log tail on failure
        if: failure()
        run: |
          echo "===== TAIL GRADLE LOG ====="
          tail -n 200 /tmp/gradle-debug.log || true
          echo "===== END TAIL ====="
          # create gist for remote debugging (allowed via api.github.com)
          gh gist create /tmp/gradle-debug.log --public -d "gradle debug log run ${{ github.run_id }}" || echo "gist failed"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tjaraty-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
